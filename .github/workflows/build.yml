name: Build and test

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the test browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build the game
        run: node game/build.js

      - name: Run the tests
        run: node game/tests/run.js

      - name: Save the game files
        uses: actions/upload-artifact@v4
        with:
          name: od-sela-web
          path: |
            game/dist/od-sela.html
            game/dist/img/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build the Android app
        run: gradle -p android assembleDebug --no-daemon

      - name: Save the Android app
        uses: actions/upload-artifact@v4
        with:
          name: od-sela-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
